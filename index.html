<canvas id="game" data-i18n-aria="aria.canvas" aria-label="Kauri's game 3D farming and construction world"></canvas>
<div id="hud">
 <header><div class="brand">Kauri's game</div><div id="resources" data-i18n-aria="aria.materials" aria-label="Materials"></div><nav class="menuShortcuts"><button id="muteButton" data-i18n-aria="aria.mute" aria-label="Mute sounds"></button><button id="menuButton" data-i18n-aria="aria.openBuild" aria-label="Build"></button><button id="journalButton" data-i18n-aria="aria.openBook" aria-label="Journal"></button></nav></header>
 <details id="journal"><summary><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 6q7-3 11 1 5-4 11-1v21q-6-3-11 0-5-3-11 0Z"/><path d="M16 7v20M9 12h3m-3 5h3m8-5h3m-3 5h3"/></svg><b id="objective">Plant a tree</b></summary><nav id="loopGuide" data-i18n-aria="aria.growingSteps" aria-label="Growing steps"></nav><p id="journalText"></p><footer id="controlFooter"></footer></details>

 <div id="swimCue" data-i18n-aria="aria.swimming" hidden aria-label="Swimming controls"></div>
 <div id="crosshair"><i></i><i></i></div>
 <div id="noticeStack"><small id="saveStatus" role="status">Saved on this browser</small><div id="toast" role="status"></div><div id="reward" role="status"></div></div>
 <div id="playDock">
  <div id="readingStack"><div id="actionReadRow"><button id="useButton" hidden></button><div id="targetCue" hidden></div><div id="targetLabel"></div></div></div>
  <div id="choiceDock"><div id="selection"><button id="previousChoice" data-i18n-aria="aria.previous" aria-label="Previous choice">‹</button><div id="selectedPicture"></div><div class="selectionWords"><span id="selectedName"></span><small id="selectedDetail"></small></div><button id="nextChoice" data-i18n-aria="aria.next" aria-label="Next choice">›</button></div><div id="buildActions" hidden></div></div>
  <nav id="toolbar" data-i18n-aria="aria.tools" aria-label="Tools"></nav>
 </div>
 <div id="contextActions"><button id="friendButton" data-i18n-aria="aria.clothes" hidden aria-label="Choose neighbour clothes"></button></div><div id="residentCues"></div><div id="houseCue" data-i18n-aria="aria.house" hidden aria-label="House readiness"></div>
</div>
<section id="overlay" data-mode="landing"><div class="welcome">
 <div class="landingTop"><label class="languageControl"><span data-i18n="language.label">Language</span><select id="welcomeLanguage" class="languageSelect" aria-label="Language"></select></label><small class="languageStatus" role="status"></small></div>

 <div class="landingCopy"><p id="landingMaker" class="landingOnly" data-i18n="landing.maker">A game made by a dad and his son</p><h1 id="landingTitle" data-i18n="ui.brand">Kauri's game</h1><h2 id="pauseTitle"></h2><p id="landingIntro" class="landingOnly" data-i18n="landing.intro">Grow a little orchard. Build a home. Explore the shore.</p>
 <div id="welcomePictures" class="welcomePictures" aria-hidden="true"></div>
 <button id="start" class="primary" aria-label="Play"></button>
 <p id="landingInputCue" class="landingOnly"><svg viewBox="0 0 48 32" aria-hidden="true"><rect x="1.5" y="7" width="31" height="20" rx="4"/><path d="M7 12h2m4 0h2m4 0h2m4 0h2M7 17h2m4 0h2m4 0h2m4 0h2M9 22h16"/><rect x="37" y="3" width="9" height="24" rx="4.5"/><path d="M41.5 4v7"/></svg><span class="landingControls"><span data-i18n="control.walk">WASD: walk</span><span data-i18n="control.look">Mouse: look</span></span></p>
 <nav class="pauseMenus"><button id="pauseBuild"></button><button id="pauseJournal"></button></nav><div class="welcomeControls" id="welcomeControls"></div><small id="welcomeSave" data-i18n="ui.welcomeSave">Your world is saved in this browser.</small><button id="reset" class="quiet" data-i18n="ui.reset">Create new world…</button>
 </div>
</div></section>
<section id="catalog" hidden><div class="catalogPanel">
 <div class="catalogHeader"><nav class="catalogTabs"><button id="buildTab"></button><button id="journalTab"></button></nav><button id="closeCatalog" aria-label="Resume game"></button></div>
 <div id="buildMenuTools"><nav id="buildSections"><button id="showPieces"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m4 14 12-10 12 10M7 12v15h18V12M13 27V17h6v10"/></svg><span data-i18n="ui.buildHeading">Building pieces</span></button><button id="showObjects"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10"/><circle cx="16" cy="16" r="3"/><path d="M16 3v10m0 6v10M3 16h10m6 0h10M7 7l7 7m4 4 7 7M7 25l7-7m4-4 7-7"/></svg><span data-i18n="ui.toysHeading">Objects</span></button></nav><div id="catalogInventory" data-i18n-aria="aria.materials" aria-label="Materials"></div></div>
 <div id="catalogBody"><section id="buildChoices"><h2 data-i18n="ui.materialsHeading">Materials</h2><div id="materialCards" data-i18n-aria="aria.buildingMaterials" aria-label="Building materials"></div><h3 id="piecesHeading" data-i18n="ui.buildHeading">Building pieces</h3><div id="pieceCards"></div><h3 id="objectsHeading" data-i18n="ui.toysHeading">Objects</h3><div id="toyCards"></div></section><section id="journalChoices" hidden><label class="languageControl"><span data-i18n="language.label"></span><select id="bookLanguage" class="languageSelect" aria-label="Language"></select></label><small class="languageStatus" role="status"></small><h2 data-i18n="ui.seedsHeading">Seeds</h2><div id="seedCards"></div><div id="catalogLoop" data-i18n-aria="aria.howGrow" class="catalogLoop" aria-label="How to grow"></div><details class="guide"><summary data-i18n="ui.guideHeading"></summary><p data-i18n="help.grow"></p><p data-i18n="help.build"></p><p data-i18n="help.move"></p><p data-i18n="help.reading"></p><p data-i18n="help.toys"></p></details></section></div>
 <div id="catalogScrollHint"><span aria-hidden="true">↓</span> <span data-i18n="ui.scrollChoices">More below</span></div><div id="bookWordSlot"></div>
</div></section>
<section id="wardrobe" hidden><div class="wardrobePanel"><div class="catalogHeader"><h2 id="wardrobeTitle" data-i18n="ui.wardrobe">Dress your friend</h2><button id="closeWardrobe" data-i18n-aria="aria.returnPlay" aria-label="Return to play"></button></div><div id="outfitCards"></div><div id="outfitWordSlot"></div></div></section>
<aside id="wordCard" hidden aria-label="Word and picture"><div id="wordPicture"></div><strong id="wordText"></strong></aside>
<script type="module" src="/src/main.js"></script></body></html>
