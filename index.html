<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#243c34"><link rel="icon" href="data:,"/><title>Kauris — The growing meadow</title></head><body>
<canvas id="game" data-i18n-aria="aria.canvas" aria-label="Kauris 3D farming and construction world"></canvas>
<div id="hud">
 <header><div class="brand">KAURIS<span data-i18n="ui.tagline">THE GROWING MEADOW</span></div><div id="resources" data-i18n-aria="aria.materials" aria-label="Materials"></div><nav class="menuShortcuts"><button id="menuButton" data-i18n-aria="aria.openBuild" aria-label="Build"></button><button id="journalButton" data-i18n-aria="aria.openBook" aria-label="Journal"></button></nav></header>
 <aside id="journal"><nav id="loopGuide" data-i18n-aria="aria.growingSteps" aria-label="Growing steps"></nav><b id="objective">Make something from a seed.</b><p id="journalText"></p><small id="saveStatus">Saved on this browser</small></aside>
 <div id="swimCue" data-i18n-aria="aria.swimming" hidden aria-label="Swimming controls"></div><div id="places" data-i18n-aria="aria.places" aria-label="Places to explore"></div>
 <div id="crosshair"><i></i><i></i></div><div id="readingStack"><div id="actionReadRow"><button id="useButton" hidden></button><div id="targetCue" hidden></div><div id="targetLabel"></div></div></div><div id="toast" role="status"></div><div id="reward" role="status"></div>
 <div id="selection"><button id="previousChoice" data-i18n-aria="aria.previous" aria-label="Previous choice">‹</button><div id="selectedPicture"></div><div class="selectionWords"><span id="selectedName"></span><small id="selectedDetail"></small></div><button id="nextChoice" data-i18n-aria="aria.next" aria-label="Next choice">›</button></div>
 <button id="muteButton" data-i18n-aria="aria.mute" aria-label="Mute sounds"></button><div id="contextActions"><button id="friendButton" data-i18n-aria="aria.clothes" hidden aria-label="Choose neighbour clothes"></button></div><div id="residentCues"></div><div id="houseCue" data-i18n-aria="aria.house" hidden aria-label="House readiness"></div><div id="buildActions" hidden></div><nav id="toolbar" data-i18n-aria="aria.tools" aria-label="Tools"></nav>
 <footer id="controlFooter"></footer>
</div>
<section id="overlay"><div class="welcome"><label class="languageControl"><span data-i18n="language.label"></span><select id="welcomeLanguage" class="languageSelect" aria-label="Language"></select></label><small class="languageStatus" role="status"></small><h1>Kauris</h1><h2 id="pauseTitle"></h2><div id="welcomePictures" class="welcomePictures"></div><button id="start" class="primary" aria-label="Start game"></button><nav class="pauseMenus"><button id="pauseBuild"></button><button id="pauseJournal"></button></nav><div class="welcomeControls" id="welcomeControls"></div><small id="welcomeSave" data-i18n="ui.welcomeSave"></small><button id="reset" class="quiet" data-i18n="ui.reset">Create new world…</button></div></section>
<section id="catalog" hidden><div class="catalogPanel"><div class="catalogHeader"><nav class="catalogTabs"><button id="buildTab"></button><button id="journalTab"></button></nav><button id="closeCatalog" aria-label="Resume game"></button></div><div id="catalogBody"><section id="buildChoices"><h2 data-i18n="ui.materialsHeading">Materials</h2><div id="materialCards" data-i18n-aria="aria.buildingMaterials" aria-label="Building materials"></div><h3 data-i18n="ui.buildHeading">Building pieces</h3><div id="pieceCards"></div><h3 data-i18n="ui.toysHeading">Objects</h3><div id="toyCards"></div></section><section id="journalChoices" hidden><label class="languageControl"><span data-i18n="language.label"></span><select id="bookLanguage" class="languageSelect" aria-label="Language"></select></label><small class="languageStatus" role="status"></small><h2 data-i18n="ui.seedsHeading">Seeds</h2><div id="seedCards"></div><div id="catalogLoop" data-i18n-aria="aria.howGrow" class="catalogLoop" aria-label="How to grow"></div><details class="guide"><summary data-i18n="ui.guideHeading"></summary><p data-i18n="help.grow"></p><p data-i18n="help.build"></p><p data-i18n="help.move"></p><p data-i18n="help.reading"></p><p data-i18n="help.toys"></p></details></section></div><div id="bookWordSlot"></div></div></section>
<section id="wardrobe" hidden><div class="wardrobePanel"><div class="catalogHeader"><h2 id="wardrobeTitle" data-i18n="ui.wardrobe">Dress your friend</h2><button id="closeWardrobe" data-i18n-aria="aria.returnPlay" aria-label="Return to play"></button></div><div id="outfitWordSlot"></div><div id="outfitCards"></div></div></section>
<aside id="wordCard" hidden aria-label="Word and picture"><div id="wordPicture"></div><strong id="wordText"></strong></aside>
<script type="module" src="/src/main.js"></script></body></html>
